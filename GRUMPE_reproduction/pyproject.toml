[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grumpe-method-reproduction"
version = "0.1.0"
description = "Transparent reproduction of the Grumpe lunar photometric DEM framework"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
geo = ["rasterio>=1.3"]
test = ["pytest>=7.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

